<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEHR AI</title>
<style>
:root{--bg:#0e3b3a;--face:#082524;--panel:#e8f2ee;--ink:#10282a;--amber:#ffc857;--sos:#d8433f;--mute:#56736f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.face{width:min(92vw,420px);background:var(--face);border-radius:48px;padding:34px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 0 0 6px #0b2f2e}
.eyes{display:flex;gap:44px}
.eye{width:64px;height:78px;border-radius:50%;background:var(--amber);position:relative;transition:transform .25s,box-shadow .25s;animation:blink 5s infinite}
.eye::after{content:"";position:absolute;left:30%;top:28%;width:26px;height:26px;border-radius:50%;background:var(--face)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.listening .eye{box-shadow:0 0 28px 6px var(--amber);transform:scale(1.12);animation:none}
.thinking .eye{transform:scaleY(.45);animation:none}
.speaking .eye{animation:talk .5s infinite alternate}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.1)}}
.status{color:#bfe3da;min-height:1.5em;text-align:center}
main{width:min(92vw,420px);margin-top:16px;display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border-radius:18px;padding:14px 16px}
.box h2{margin:0 0 6px;font-size:1rem}
#said,#reply{min-height:1.5em}
#said{color:var(--mute)}
.row{display:flex;gap:12px}
button{font:inherit;border:0;border-radius:18px;padding:18px;cursor:pointer;font-weight:700}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#mic{flex:2;background:var(--amber);color:var(--ink);font-size:1.15rem}
#sos{flex:1;background:var(--sos);color:#fff;font-size:1.15rem}
ul{margin:0;padding-left:20px}
input{width:100%;font:inherit;padding:10px;margin:4px 0 10px;border:2px solid #b6cfc8;border-radius:10px}
.hint{color:var(--mute);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.eye{animation:none!important}}
</style>
</head>
<body>
<div class="face" id="face">
  <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
  <div class="status" id="status">Men Mehrman. Gapirish uchun tugmani bosing.</div>
</div>

<main>
  <div class="row">
    <button id="mic">Gapirish</button>
    <button id="sos">SOS</button>
  </div>
  <div class="box"><h2>Siz aytdingiz</h2><div id="said">…</div></div>
  <div class="box"><h2>Mehr javobi</h2><div id="reply">…</div></div>
  <div class="box"><h2>Eslatmalar</h2><ul id="rem"></ul><div class="hint" id="remHint">Masalan: “10 daqiqadan keyin dori ichishni eslat” yoki “soat 9 da eslat”.</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
const face = $("face"), statusEl = $("status");
const store = k => { try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } };
const put = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

function setState(cls, text){ face.className = "face " + cls; if(text) statusEl.textContent = text; }

/* ---------- Ovoz chiqarish ---------- */
function pickVoice(){
  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang.toLowerCase().startsWith("uz"))
      || v.find(x => x.lang.toLowerCase().startsWith("tr"))   // lotin o‘zbekchasiga eng yaqin
      || null;
}
function say(text){
  $("reply").textContent = text;
  return new Promise(res => {
    if(!("speechSynthesis" in window)){ res(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "uz-UZ"; }
    u.onstart = () => setState("speaking","Gapiryapman…");
    u.onend = u.onerror = () => { setState("","Tayyorman."); res(); };
    speechSynthesis.speak(u);
  });
}
speechSynthesis.onvoiceschanged = () => {};

/* ---------- Eslatmalar ---------- */
let reminders = [];
function renderRem(){
  $("rem").innerHTML = reminders.map(r => `<li>${r.time.toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})} — ${r.text}</li>`).join("");
  $("remHint").style.display = reminders.length ? "none" : "block";
}
function addReminder(text){
  const now = new Date(); let when = null;
  let m = text.match(/(\d+)\s*daqiqa/i);
  if(m){ when = new Date(now.getTime() + (+m[1])*60000); }
  m = m || null;
  const h = text.match(/soat\s*(\d{1,2})(?:[:.](\d{2}))?/i);
  if(!when && h){
    when = new Date(now); when.setHours(+h[1], +(h[2]||0), 0, 0);
    if(when <= now) when.setDate(when.getDate()+1);
  }
  if(!when) return false;
  reminders.push({time:when, text:text.replace(/eslat\w*/i,"").trim() || "Eslatma"});
  renderRem();
  return when;
}
setInterval(() => {
  const now = new Date();
  reminders.filter(r => r.time <= now).forEach(r => say("Eslatma: " + r.text));
  reminders = reminders.filter(r => r.time > now);
  renderRem();
}, 5000);

/* ---------- SOS (tasodifan bosilishdan 5 soniyalik kechikish bilan) ---------- */
let sosTimer = null;
$("sos").onclick = () => {
  if(sosTimer){ clearInterval(sosTimer); sosTimer = null; $("sos").textContent = "SOS"; setState("","SOS bekor qilindi."); return; }
  let n = 5; $("sos").textContent = "Bekor (" + n + ")"; setState("","SOS yuboriladi. Bekor qilish uchun yana bosing.");
  sosTimer = setInterval(async () => {
    n--; $("sos").textContent = "Bekor (" + n + ")";
    if(n <= 0){ clearInterval(sosTimer); sosTimer = null; $("sos").textContent = "SOS"; await sendSOS(); }
  }, 1000);
};
async function sendSOS(){
  try{
    const r = await fetch("/api/sos",{method:"POST"});
    if(!r.ok) throw new Error(r.status);
    await say("Yaqinlaringizga xabar yuborildi.");
  }catch(e){ await say("Xabar yuborib bo‘lmadi. Internetni tekshiring."); }
}

/* ---------- AI ---------- */
let history = [];
async function askAI(text){
  history.push({role:"user", content:text}); history = history.slice(-8);
  const r = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
  if(!r.ok) return "AI bilan bog‘lanib bo‘lmadi (" + r.status + ").";
  const a = (await r.json()).reply;
  history.push({role:"assistant", content:a});
  return a;
}

/* ---------- Buyruqlar ---------- */
async function handle(text){
  $("said").textContent = text;
  const t = text.toLowerCase();
  if(/\b(sos|yordam bering|yordam kerak)\b/.test(t)){ $("sos").click(); await say("SOS yuboriladi. Bekor qilish uchun SOS tugmasini bosing."); return; }
  if(/soat necha|vaqt necha|soat nechi/.test(t)){
    await say("Hozir soat " + new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"}) + "."); return;
  }
  if(/eslat/.test(t)){
    const w = addReminder(text);
    await say(w ? "Yaxshi, " + w.toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"}) + " da eslataman." : "Qaysi vaqtga eslatay? Masalan: 10 daqiqadan keyin.");
    return;
  }
  setState("thinking","O‘ylayapman…");
  try{ await say(await askAI(text)); }
  catch(e){ await say("Internet bilan muammo bor. Qayta urinib ko‘ring."); }
}

/* ---------- Mikrofon ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
$("mic").onclick = () => {
  if(!SR){ setState("","Bu brauzer ovozni tanimaydi. Chrome ishlating."); return; }
  if(listening){ rec.stop(); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = "uz-UZ"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { listening = true; $("mic").textContent = "Tinglayapman…"; setState("listening","Tinglayapman…"); };
  rec.onresult = e => handle(e.results[0][0].transcript);
  rec.onerror = e => setState("", e.error === "not-allowed" ? "Mikrofonga ruxsat bering." : "Eshitilmadi, qayta urinib ko‘ring.");
  rec.onend = () => { listening = false; $("mic").textContent = "Gapirish"; if(face.className.includes("listening")) setState("",""); };
  rec.start();
};
renderRem();
</script>
</body>
</html>
